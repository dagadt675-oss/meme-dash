<style>

*{box-sizing:border-box}

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
let KEY=null,KID=null,PW=null;
async function getKey(blob){const id=blob.salt+"|"+blob.iter;if(KEY&&KID===id)return KEY;

 const key=await getKey(blob);const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(blob.iv)},key,b64(blob.ct));return JSON.parse(new TextDecoder().decode(buf))}
